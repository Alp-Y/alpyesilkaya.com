name: Keep HugeWorld database awake

# Supabase's free plan pauses a project after about a week without use.
# This sends one small request twice a week. It reads the public address and
# key from the published app, and does nothing until they are set.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          url=$(sed -n 's/.*supabaseUrl: "\([^"]*\)".*/\1/p' public/hugeworld/config.js)
          key=$(sed -n 's/.*supabaseKey: "\([^"]*\)".*/\1/p' public/hugeworld/config.js)
          if [ -z "$url" ]; then echo "Not configured yet"; exit 0; fi
          curl -fsS -o /dev/null "$url/rest/v1/docs?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key"
